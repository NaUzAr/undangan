services:
  app:
    build: .
    container_name: undangan_nikahan_app
    restart: always
    ports:
      - "8080:80"
    env_file:
      - ./src/.env
    volumes:
      - ./src/storage:/var/www/html/storage
      - ./src/database:/var/www/html/database
    networks:
      - webapps

networks:
  webapps:
    external: true
